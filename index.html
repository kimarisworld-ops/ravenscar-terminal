<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ravenscar Asylum — Project Silent Watch</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061009}
body{font-family:"Courier New",monospace;color:#a9d6a2;text-shadow:0 0 6px rgba(137,220,142,.4)}
.screen{position:relative;width:100%;height:100%;padding:4.5% 6%;
background:repeating-linear-gradient(0deg,rgba(120,180,120,.04) 0 1px,transparent 2px 4px),
radial-gradient(ellipse at center,#17251a 0%,#08110b 75%,#030604 100%)}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #48634a;padding-bottom:2%;font-size:clamp(8px,1.8vw,16px);letter-spacing:.12em}
.alert{color:#d07c70;border:1px solid #8b3934;padding:2px 7px}
h1{font-size:clamp(18px,4.3vw,38px);line-height:1;margin:4.5% 0 1%}
.sub{font-size:clamp(7px,1.45vw,13px);letter-spacing:.12em;color:#83ad86}
.prompt{text-align:center;margin:4% 0 2%;font-size:clamp(8px,1.55vw,14px)}
.display{height:11%;min-height:22px;display:flex;align-items:center;justify-content:center;gap:3%;
border:1px solid #45664a;background:rgba(0,0,0,.42);margin:0 auto 3%;width:78%;
font-size:clamp(17px,3.8vw,34px);letter-spacing:.22em;color:#d0e8b8}
.pad{width:78%;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:2.2%;height:42%}
.key{display:flex;align-items:center;justify-content:center;border:1px solid #58745a;background:linear-gradient(#17251a,#09110b);
color:#b9dfae;font-size:clamp(12px,2.6vw,23px);font-weight:bold;box-shadow:inset 0 0 10px rgba(0,0,0,.6)}
.key.small{font-size:clamp(7px,1.35vw,12px);letter-spacing:.04em}
.status{text-align:center;margin-top:3%;font-size:clamp(7px,1.35vw,12px);color:#82a984;letter-spacing:.08em}
.footer{position:absolute;bottom:3.5%;left:6%;right:6%;display:flex;justify-content:space-between;color:#6f9874;font-size:clamp(6px,1.1vw,10px);letter-spacing:.08em}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
</style>
</head>
<body>
<main class="screen">
  <div class="top"><span>RAVENSCAR ASYLUM</span><span class="alert">CLASSIFIED</span></div>
  <h1>PROJECT<br>SILENT WATCH</h1>
  <div class="sub">CENTRAL RECORDS TERMINAL · SYSTEM 04</div>
  <div class="prompt">SECURITY AUTHENTICATION REQUIRED</div>
  <div class="display">_ _ _ _ _ _</div>
  <div class="pad" aria-label="Visual keypad">
    <div class="key">1</div><div class="key">2</div><div class="key">3</div>
    <div class="key">4</div><div class="key">5</div><div class="key">6</div>
    <div class="key">7</div><div class="key">8</div><div class="key">9</div>
    <div class="key small">CLEAR</div><div class="key">0</div><div class="key small">ENTER</div>
  </div>
  <div class="status">HINTS ARE RELEASED AFTER INCORRECT ATTEMPTS <span class="blink">_</span></div>
  <div class="footer"><span>INTERNAL NETWORK // DO NOT POWER DOWN</span><span>SW-ARCHIVE / 04</span></div>
</main>
</body>
</html>
